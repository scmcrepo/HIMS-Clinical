# =============================================================================
#  Local SonarQube server — kept SEPARATE from the application's
#  docker-compose.yml so the app stack is unchanged.
#
#  Start:  docker compose -f docker-compose.sonarqube.yml up -d
#  UI:     http://localhost:9000   (default login: admin / admin)
#  Stop:   docker compose -f docker-compose.sonarqube.yml down
# =============================================================================

services:

  sonarqube:
    image: sonarqube:community
    container_name: hms-sonarqube
    restart: unless-stopped
    depends_on:
      sonar-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
    # SonarQube's Elasticsearch needs a raised mmap limit. If the container
    # fails to boot, run on the host:  sysctl -w vm.max_map_count=524288
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  # Dedicated PostgreSQL for SonarQube (independent of the app's hms-db).
  sonar-db:
    image: postgres:16-alpine
    container_name: hms-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sonarqube
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
    volumes:
      - sonar-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonar-db-data:
