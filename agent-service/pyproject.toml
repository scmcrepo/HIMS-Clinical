[project]
name = "hms-agent-service"
version = "0.1.0"
description = "LangGraph orchestrator for HIMS-Clinical. Speaks to the HMS only through its authenticated agent gateway."
requires-python = ">=3.11"
dependencies = [
  "langgraph>=1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "httpx>=0.27",
  "python-json-logger>=2.0",
  "prometheus-client>=0.20",
  "fastapi>=0.110",
  # Telephony providers post form-encoded webhooks; FastAPI needs this to parse them.
  "python-multipart>=0.0.9",
  "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "respx>=0.21", "ruff", "mypy"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
