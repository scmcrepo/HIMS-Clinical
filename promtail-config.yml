server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
- job_name: hms-backend
  static_configs:
  - targets:
      - localhost
    labels:
      job: hms-backend
      env: dev
      __path__: /var/log/hms/*.log
  pipeline_stages:
    - json:
        expressions:
          level: level
          logger_name: logger_name
    - labels:
        level:
        logger_name:
