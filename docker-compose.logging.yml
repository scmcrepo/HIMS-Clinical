services:
  # ── Loki (The Log Database)
  loki:
    image: grafana/loki:latest
    container_name: hms-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped
    volumes:
      - loki-data:/loki

  # ── Promtail (The Log Shipper)
  promtail:
    image: grafana/promtail:latest
    container_name: hms-promtail
    volumes:
      # Mount the backend logs directory so Promtail can read them
      - ./backend/logs:/var/log/hms
      # Mount our custom configuration file
      - ./promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    restart: unless-stopped
    depends_on:
      - loki

  # ── Prometheus (The Metrics Database) — WO-001/T-002
  prometheus:
    image: prom/prometheus:latest
    container_name: hms-prometheus
    ports:
      - "9090:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── Grafana (The Dashboard)
  grafana:
    image: grafana/grafana:latest
    container_name: hms-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    restart: unless-stopped
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
      - prometheus

volumes:
  loki-data:
  grafana-data:
  prometheus-data:
