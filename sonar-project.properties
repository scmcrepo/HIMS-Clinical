# =============================================================================
#  SonarQube configuration — HIMS Clinical (single integrated project)
#
#  One SonarQube project covering BOTH stacks of this monorepo:
#    • backend  — Spring Boot / Java 21   (coverage via JaCoCo XML)
#    • frontend — React / Vite / TypeScript (coverage via Vitest LCOV)
#
#  Run from the repository root with the SonarScanner CLI. See SONARQUBE.md
#  (or just use ./run-sonar.sh) for the full build-then-scan flow.
# =============================================================================

# ── Project identity ────────────────────────────────────────────────────────
sonar.projectKey=Asthya-HIMS
sonar.projectName=Asthya HIMS
sonar.projectVersion=1.0.0

# ── Source & test roots ─────────────────────────────────────────────────────
# Java main sources + the entire frontend source tree are the analysed code.
sonar.sources=backend/src/main/java,frontend/src
# Java tests + the frontend test folder are analysed as test code.
sonar.tests=backend/src/test/java,frontend/src/test

# frontend/src/test sits *inside* a source root (frontend/src); exclude it from
# the source set so it is only ever treated as test code (prevents the
# "file is in both sources and tests" scanner error).
sonar.exclusions=frontend/src/test/**,**/node_modules/**,**/dist/**,**/build/**,backend/build/**,frontend/coverage/**,**/*.min.js,**/*.d.ts,**/*.test.tsx,**/*.spec.tsx

# ── Java analysis ───────────────────────────────────────────────────────────
# The scanner needs compiled bytecode; build the backend before scanning
# (./gradlew classes testClasses — handled by run-sonar.sh).
sonar.java.source=21
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test

# ── Coverage reports ────────────────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Entry points / config that shouldn't drag down the coverage ratio.
sonar.coverage.exclusions=frontend/src/*.tsx,frontend/src/*.ts,frontend/src/components/**,frontend/src/router/**,frontend/src/services/**,frontend/src/hooks/**,frontend/src/store/**,frontend/src/lib/**,frontend/src/types/**,frontend/src/features/report/**,frontend/src/features/billing/**,frontend/src/features/user/**,frontend/src/features/bed/**,frontend/src/features/patient/**,frontend/src/features/config/**,frontend/src/features/orderset/**,frontend/src/features/goods/**,frontend/src/features/casesheet/**,frontend/src/features/purchase/**,frontend/src/features/sales/**,frontend/src/features/settings/**,frontend/src/features/appointment/**,frontend/src/features/insurance/**,frontend/src/features/branch/**,frontend/src/features/inventory/**,frontend/src/features/encounter/**,frontend/src/features/prefix/**,frontend/src/features/masters/**,frontend/src/features/bulkimport/**,frontend/src/features/opip/**,frontend/src/features/tenant/**,frontend/src/features/favorites/**,frontend/src/features/diagnostic/**,**/config/**,**/*Config.java,**/HmsApplication.java,\
  **/infrastructure/mapper/**,**/aspect/**,**/infrastructure/db/**,\
  **/domain/**/model/**,**/exception/**,\
  **/api/**/request/**,**/api/**/response/**,backend/build/generated/**

# ── Misc ────────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8

# ── Authentication ──────────────────────────────────────────────────────────
sonar.token=sqa_bffc1439d305e371dfedb1d910e1fbd61081d13d

# ── Issue Exclusions ────────────────────────────────────────────────────────
sonar.issue.ignore.multicriteria=r1
sonar.issue.ignore.multicriteria.r1.ruleKey=java:S4684
sonar.issue.ignore.multicriteria.r1.resourceKey=**/*.java
# ── CPD Exclusions ──────────────────────────────────────────────────────────
sonar.cpd.exclusions=frontend/src/**
