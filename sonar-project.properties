# =============================================================================
#  SonarQube configuration — HIMS Clinical (single integrated project)
#
#  One SonarQube project covering BOTH stacks of this monorepo:
#    • backend  — Spring Boot / Java 21   (coverage via JaCoCo XML)
#    • frontend — React / Vite / TypeScript (coverage via Vitest LCOV)
#
#  Run from the repository root with the SonarScanner CLI. See SONARQUBE.md
#  (or just use ./run-sonar.sh) for the full build-then-scan flow.
# =============================================================================

# ── Project identity ────────────────────────────────────────────────────────
sonar.projectKey=Asthya-HIMS
sonar.projectName=Asthya HIMS
sonar.projectVersion=1.0.0

# ── Source & test roots ─────────────────────────────────────────────────────
# Java main sources + the entire frontend source tree are the analysed code.
sonar.sources=backend/src/main/java,frontend/src
# Java tests + the frontend test folder are analysed as test code.
sonar.tests=backend/src/test/java,frontend/src/test

# frontend/src/test sits *inside* a source root (frontend/src); exclude it from
# the source set so it is only ever treated as test code (prevents the
# "file is in both sources and tests" scanner error).
sonar.exclusions=frontend/src/test/**,**/node_modules/**,**/dist/**,**/build/**,backend/build/**,frontend/coverage/**,**/*.min.js,**/*.d.ts

# ── Java analysis ───────────────────────────────────────────────────────────
# The scanner needs compiled bytecode; build the backend before scanning
# (./gradlew classes testClasses — handled by run-sonar.sh).
sonar.java.source=21
sonar.java.binaries=backend/build/classes/java/main
sonar.java.test.binaries=backend/build/classes/java/test

# ── Coverage reports ────────────────────────────────────────────────────────
sonar.coverage.jacoco.xmlReportPaths=backend/build/reports/jacoco/test/jacocoTestReport.xml
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Entry points / config that shouldn't drag down the coverage ratio.
sonar.coverage.exclusions=**/config/**,**/*Config.java,**/HmsApplication.java,frontend/src/main.tsx

# ── Misc ────────────────────────────────────────────────────────────────────
sonar.sourceEncoding=UTF-8
